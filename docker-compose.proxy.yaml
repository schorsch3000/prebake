# prebake behind a filtering Docker socket proxy: the daemon container has no Docker
# socket. Standalone file, use it instead of docker-compose.yaml:
#
#   docker compose -f docker-compose.proxy.yaml up -d --build
#   docker compose -f docker-compose.proxy.yaml down
#
# (Set COMPOSE_FILE=docker-compose.proxy.yaml in .env to drop the -f.)
# Set REPO_URL, then see README.md. The prebake service is the same as in
# docker-compose.yaml except for the lines marked "proxy mode"; a test keeps the two
# files in sync.
#
# The proxy (wollomatic/socket-proxy, a small Go program) allows requests by HTTP
# method and URL path only, never by request body. That is why prebake runs smoke
# tests as build steps instead of `docker run`: if container creation were allowed,
# anybody could start a privileged container and the proxy would protect nothing.
# As configured below the daemon can build, pull, tag, push and remove images, and
# nothing else.
#
# Why not Tecnativa/docker-socket-proxy (HAProxy)? buildx talks to the Docker engine
# through `POST /grpc` with `Upgrade: h2c`; HAProxy does not pass that upgrade on, the
# engine answers 500, and buildx then falls back to a docker-container builder, which
# needs container access. A Go reverse proxy passes the upgrade through.
services:
  prebake:
    build: .
    image: prebake:local
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL:?set REPO_URL to the config repo, e.g. git@github.com:me/prebake-config.git}
      REPO_BRANCH: ${REPO_BRANCH:-main}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      JITTER: ${JITTER:-15m}   # builds start at a random offset within this after a slot opens
      TZ:                      # build slots use this zone; unset = the host's zone (see /etc/localtime below)
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      # TLS for the read-only registry listener: mount the files below and set both.
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      DOCKER_HOST: tcp://docker-proxy:2375   # proxy mode
    ports:
      - "5000:5000"            # registry, read-only, for everybody
      - "127.0.0.1:5001:5001"  # registry, write: loopback ONLY, the host dockerd pushes here
      - "8080:8080"            # status page and control API (no authentication)
    volumes:
      - prebake-data:/data     # proxy mode: no Docker socket here
      # The host's time zone, so build slots mean what you expect. create_host_path: false makes
      # compose fail instead of creating a directory when the file does not exist.
      - type: bind
        source: ${LOCALTIME_FILE:-/etc/localtime}
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
      # - ./certs:/certs:ro
    networks:                  # proxy mode
      - default
      - docker-api
    depends_on:                # proxy mode
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "prebake", "status", "--url", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  docker-proxy:
    # pinned to 1.13.1 by digest; update deliberately
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    environment:
      SP_LISTENIP: 0.0.0.0
      SP_ALLOWFROM: prebake              # only the daemon's service name may connect
      SP_ALLOWHEALTHCHECK: "true"
      SP_LOGLEVEL: ${PROXY_LOGLEVEL:-info}   # blocked requests are always logged
      # Anchored regexps per method. Everything not listed is refused.
      SP_ALLOW_HEAD: '/_ping'
      SP_ALLOW_GET: '(/_ping|/v1\.\d+/(version|info|images/.*))'
      # buildx: /grpc and /session (unversioned or versioned), /build; images: tag, push, pull
      SP_ALLOW_POST: '((/v1\.\d+)?/(grpc|session)|/v1\.\d+/(build|images/.*))'
      SP_ALLOW_DELETE: '/v1\.\d+/images/.*'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    # The image runs as 65534, which cannot open the root-owned socket (mode 660, group
    # docker). Run as root with every capability dropped instead: root owns the socket, so
    # no capability is needed to connect. To avoid root, use `user: "65534:<docker gid>"`.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  docker-api:
    internal: true     # only prebake and the proxy are on it; the proxy port is not published

volumes:
  prebake-data:
