# Optional: let the daemon reach Docker only through a filtering socket proxy
# instead of mounting /var/run/docker.sock into it.
#
#   docker compose -f docker-compose.yaml -f docker-compose.proxy.yaml up -d --build
#
# The proxy (wollomatic/socket-proxy, a small Go program) allows requests by HTTP
# method and URL path only, never by request body. That is why prebake runs smoke
# tests as build steps instead of `docker run`: if container creation were allowed,
# anybody could start a privileged container and the proxy would protect nothing.
# As configured here the daemon can build, pull, tag, push and remove images, and
# nothing else.
#
# Why not Tecnativa/docker-socket-proxy (HAProxy)? buildx talks to the Docker engine
# through `POST /grpc` with `Upgrade: h2c`; HAProxy does not pass that upgrade on, the
# engine answers 500, and buildx then falls back to a docker-container builder, which
# needs container access. A Go reverse proxy passes the upgrade through.
#
# Needs Docker Compose >= 2.24 (`!override`).
services:
  docker-proxy:
    # pinned to 1.13.1 by digest; update deliberately
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    environment:
      SP_LISTENIP: 0.0.0.0
      SP_ALLOWFROM: prebake              # only the daemon's service name may connect
      SP_ALLOWHEALTHCHECK: "true"
      SP_LOGLEVEL: ${PROXY_LOGLEVEL:-info}   # blocked requests are always logged
      # Anchored regexps per method. Everything not listed is refused.
      SP_ALLOW_HEAD: '/_ping'
      SP_ALLOW_GET: '(/_ping|/v1\.\d+/(version|info|images/.*))'
      # buildx: /grpc and /session (unversioned or versioned), /build; images: tag, push, pull
      SP_ALLOW_POST: '((/v1\.\d+)?/(grpc|session)|/v1\.\d+/(build|images/.*))'
      SP_ALLOW_DELETE: '/v1\.\d+/images/.*'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    # The image runs as 65534, which cannot open the root-owned socket (mode 660, group
    # docker). Run as root with every capability dropped instead: root owns the socket, so
    # no capability is needed to connect. To avoid root, use `user: "65534:<docker gid>"`.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30

  prebake:
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    # drop the socket mount of the base file; keep only the data volume
    volumes: !override
      - prebake-data:/data
    networks:
      - default
      - docker-api
    depends_on:
      docker-proxy:
        condition: service_healthy

networks:
  docker-api:
    internal: true     # only prebake and the proxy are on it; the proxy port is not published
