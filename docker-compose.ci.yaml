# Used by scripts/ci-e2e.sh: points the daemon at a local bare repo instead of a
# remote one and makes it poll quickly.
services:
  prebake:
    environment:
      REPO_URL: /origin.git
      POLL_INTERVAL: 5s
      JITTER: 0s
      # The mounted repo belongs to the runner user, not to root in the container, so git
      # refuses it ("dubious ownership"). safe.directory only counts from a config file:
      # GIT_CONFIG_COUNT/-c style settings are dropped when git spawns upload-pack for a
      # local clone, but GIT_CONFIG_GLOBAL is inherited.
      GIT_CONFIG_GLOBAL: /ci-gitconfig
    volumes:
      - ${CI_ORIGIN:-/tmp/ci-origin.git}:/origin.git:ro
      - ${CI_GITCONFIG:-/tmp/ci-gitconfig}:/ci-gitconfig:ro
