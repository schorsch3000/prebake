name: ci

# Branch pushes and pull requests. Releases (tags) are in release.yml: they do not run the
# tests again, they require that this workflow passed for the tagged commit.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # one image layer cache for the whole run: the image job writes it, the jobs after it read it
  IMAGE_CACHE: prebake-image

jobs:
  lint:
    name: lint and static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: shellcheck scripts/*.sh
      - name: static build (no cgo)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/prebake

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: test
      - run: go test -race -count=1 ./...

  archives:
    name: release archives (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: archives
      - name: build the archives for every platform
        run: scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: the linux binary runs
        run: |
          tar -xzOf "$RUNNER_TEMP"/dist/prebake_0.0.0-ci_linux_amd64.tar.gz prebake_0.0.0-ci_linux_amd64/prebake > "$RUNNER_TEMP/prebake"
          chmod +x "$RUNNER_TEMP/prebake"
          "$RUNNER_TEMP/prebake" version | grep -q '^prebake 0.0.0-ci '
          for a in "$RUNNER_TEMP"/dist/*.tar.gz; do tar -tzf "$a" | grep -q '/LICENSE$' || { echo "no LICENSE in $a"; exit 1; }; done
          unzip -l "$RUNNER_TEMP"/dist/*.zip | grep -q '/LICENSE$'

  integration:
    name: docker integration tests
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: wait for registry
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5001/v2/ && exit 0
            sleep 1
          done
          echo "registry did not come up"; exit 1
      - name: integration tests
        # explicit shell enables pipefail, so a failing test is not masked by tee;
        # -v so skipped tests are visible (a skip here means Docker or the registry is broken)
        shell: bash
        run: go test -tags integration -count=1 -v ./internal/build/ ./internal/registry/ | tee /tmp/integration.log
      - name: fail if integration tests were skipped
        run: "! grep -E '^(--- SKIP|\\s+--- SKIP)' /tmp/integration.log"

  image:
    name: daemon image and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: compose files are valid
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.proxy.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml config -q
        env:
          REPO_URL: git@example.com:me/prebake-config.git
      - name: build the image (and fill the layer cache for the jobs after this one)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prebake:local
          build-args: |
            VERSION=local
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE }}
          # ignore-error: pull requests from forks cannot write the cache; that must not fail the build
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_CACHE }},ignore-error=true
      - name: binary runs in the image
        run: |
          docker run --rm prebake:local --help
          docker run --rm prebake:local version | grep -q '^prebake local '
      - name: ssh and docker tooling present
        run: |
          docker run --rm --entrypoint sh prebake:local -c \
            'git --version && ssh -V && docker --version && docker buildx version'

  e2e:
    name: compose end-to-end (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: docker socket
            proxy: ""
          - mode: socket proxy
            proxy: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: the image under test, from the layer cache of the image job
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prebake:local
          build-args: |
            VERSION=local
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE }}
      - name: run the daemon from compose against a local repo
        run: scripts/ci-e2e.sh
        env:
          PREBAKE_PROXY: ${{ matrix.proxy }}
          PREBAKE_IMAGE_PREBUILT: "1"

  publish:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    needs: [lint, test, archives, integration, image, e2e]
    # only for main, and only when everything above is green
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main: edge and the commit; releases are published by release.yml
          tags: |
            type=edge,branch=main
            type=sha,format=short
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE }}
      - name: the published image runs
        run: |
          docker run --rm "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" version
          echo "published ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
