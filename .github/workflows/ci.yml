name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: static build (no cgo)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/prebake
      - name: release archives build (dry run)
        run: |
          scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
          tar -xzOf "$RUNNER_TEMP"/dist/prebake_0.0.0-ci_linux_amd64.tar.gz prebake_0.0.0-ci_linux_amd64/prebake > "$RUNNER_TEMP/prebake"
          chmod +x "$RUNNER_TEMP/prebake"
          "$RUNNER_TEMP/prebake" version | grep -q '^prebake 0.0.0-ci '

  integration:
    name: docker integration tests
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: wait for registry
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5001/v2/ && exit 0
            sleep 1
          done
          echo "registry did not come up"; exit 1
      - name: integration tests
        # explicit shell enables pipefail, so a failing test is not masked by tee;
        # -v so skipped tests are visible (a skip here means Docker or the registry is broken)
        shell: bash
        run: go test -tags integration -count=1 -v ./internal/build/ ./internal/registry/ | tee /tmp/integration.log
      - name: fail if integration tests were skipped
        run: "! grep -E '^(--- SKIP|\\s+--- SKIP)' /tmp/integration.log"

  image:
    name: daemon image and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose files are valid
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.proxy.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml config -q
        env:
          REPO_URL: git@example.com:me/prebake-config.git
      - name: build image
        run: docker compose -f docker-compose.yaml -f docker-compose.build.yaml build
        env:
          REPO_URL: git@example.com:me/prebake-config.git
      - name: binary runs in the image
        run: |
          docker run --rm prebake:local --help
          docker run --rm prebake:local version | grep -q '^prebake local '
      - name: ssh and docker tooling present
        run: |
          docker run --rm --entrypoint sh prebake:local -c \
            'git --version && ssh -V && docker --version && docker buildx version'

  e2e:
    name: compose end-to-end (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: docker socket
            proxy: ""
          - mode: socket proxy
            proxy: "1"
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: run the daemon from compose against a local repo
        run: scripts/ci-e2e.sh
        env:
          PREBAKE_PROXY: ${{ matrix.proxy }}

  publish:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    needs: [unit, integration, image, e2e]
    # only for main and release tags, and only when everything above is green
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main: edge + sha; v1.2.3: 1.2.3, 1.2 and latest
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
      - name: the published image runs
        run: |
          docker run --rm "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" version
          echo "published ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release with CLI binaries
    runs-on: ubuntu-latest
    needs: [unit, integration, image, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes "${flags[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Command line tool for validating a config repo and talking to a running daemon (\`validate\`, \`install-hook\`, \`status\`, \`trigger\`, ...). Check the download against \`checksums.txt\`. The daemon itself is the container image \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`. The macOS and Windows archives are built but not tested by CI."
