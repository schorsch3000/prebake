name: go build cache
description: >
  Restores the Go build and module caches of the latest run, and (on main only) saves the
  caches of this run. actions/setup-go caches only once per go.sum and never updates the
  entry, so objects for other platforms, -race builds and newer code would never be cached.
inputs:
  name:
    description: cache family, so that jobs with different build flags do not overwrite each other
    required: true
runs:
  using: composite
  steps:
    - name: restore and save (main)
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ inputs.name }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-${{ inputs.name }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
          go-${{ inputs.name }}-${{ runner.os }}-
    - name: restore only (all other refs)
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ inputs.name }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-${{ inputs.name }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
          go-${{ inputs.name }}-${{ runner.os }}-
